<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>药品管理系统</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link th:href="@{/layui/css/layui.css}" rel="stylesheet">
</head>
<body>
<div class="layui-layout layui-layout-admin">
    <!-- 头部区域 -->
    <div class="layui-header" style="font-weight: bold;">
        <div class="layui-logo layui-bg-black" style="letter-spacing: 3px;">药品管理系统</div>
        <ul class="layui-nav layui-layout-left">
            <li class="layui-nav-item" lay-unselect lay-header-event="menuChange">
                <a href="#" title="边栏伸缩"><i id="leftEnumIcon" class="layui-icon layui-icon-shrink-right"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect lay-header-event="menuRefresh">
                <a href="#" title="刷新页面"><i class="layui-icon layui-icon-refresh-3"></i></a>
            </li>
        </ul>
        <ul class="layui-nav layui-layout-right">
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a href="https://blog.csdn.net/SuperCodeZhy" title="关于作者" target="_blank">
                    <i class="layui-icon layui-icon-face-smile-b"></i>
                </a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect>
                <a href="https://github.com/China-Zhy/DrugManage" title="项目代码" target="_blank">
                    <i class="layui-icon layui-icon-github"></i>
                </a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect lay-header-event="menuNotice">
                <a href="#" title="消息中心">
                    <i class="layui-icon layui-icon-notice"></i>
                    <!-- 如果有新消息，则显示小圆点 -->
                    <!--<span class="layui-badge-dot"></span>-->
                </a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect lay-header-event="menuNote">
                <a href="#" title="小备忘录"><i class="layui-icon layui-icon-note"></i></a>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect lay-header-event="menuFull">
                <a href="#" title="充满屏幕">
                    <i class="layui-icon layui-icon-screen-full" id="tool-screen-full"></i>
                </a>
            </li>
            <li class="layui-nav-item">
                <a href="#">
                    <img th:src="${session.loginUser.base64}" class="layui-nav-img" alt="头像">
                    <span th:text="${session.loginUser.name}"></span>
                </a>
                <dl class="layui-nav-child" style="text-align: center;">
                    <dd lay-header-event="aboutMe"><a href="#">基本资料</a></dd>
                    <dd lay-header-event="setPass"><a href="#">修改密码</a></dd>
                    <dd lay-header-event="logout"><a href="#">退出登录</a></dd>
                </dl>
            </li>
            <li class="layui-nav-item layui-hide-xs" lay-unselect lay-header-event="menuAbout">
                <a href="#" title="更多信息">
                    <i class="layui-icon layui-icon-more-vertical"></i>
                </a>
            </li>
        </ul>
    </div>
    <!-- 左侧导航菜单 -->
    <div class="layui-side layui-bg-black" style="font-weight: bold;">
        <div class="layui-side-scroll">
            <!-- 左侧导航区域 -->
            <ul class="layui-nav layui-nav-tree" lay-filter="test" style="letter-spacing: 1px;" lay-accordion id="indexSideMenu">
                <!--遍历所有一级菜单-->
                <li class="layui-nav-item" th:each="menus : ${menuList}" th:if="${menus.level == 1}">
                    <a href="javascript:void(0);" th:data-id="${menus.id}" th:data-url="${menus.url}" th:data-name="${menus.name}"
                       th:attr="lay-aside-event=${#lists.size(menus.children) > 0} ? null : 'menuAction'">
                        <i th:class="${menus.icon}"></i> <cite th:text="${menus.name}"></cite>
                    </a>
                    <!--如果一级菜单有子菜单，则生成二级菜单-->
                    <dl class="layui-nav-child" th:if="${#lists.size(menus.children) > 0}">
                        <!--遍历当前一级菜单的所有子菜单(二级菜单)-->
                        <dd th:each="childMenu : ${menus.children}">
                            <a href="javascript:void(0);" th:data-id="${childMenu.id}" th:data-url="${childMenu.url}" th:data-name="${childMenu.name}" lay-aside-event="menuAction">
                                <i th:class="${childMenu.icon}"></i> <cite th:text="${childMenu.name}"></cite>
                            </a>
                        </dd>
                    </dl>
                </li>
            </ul>
        </div>
    </div>
    <!-- 内容主体区域 -->
    <div class="layui-body">
        <div class="layui-tabs layui-hide-v" id="demoTabs" lay-options="{closable: true, headerMode:'scroll'}" style="display: flex; flex-direction: column; height: 100%;">
            <ul class="layui-tabs-header" style="flex-shrink: 0;">
                <li lay-id="0" lay-closable="false">🔹系统数据概览</li>
            </ul>
            <div class="layui-tabs-body" style="flex-grow: 1; overflow: auto; padding: 0;">
                <div class="layui-tabs-item">
                    <iframe src="/toSystemHome" style="border: none;position: absolute;width: 100%;height: 100%;left: 0;top: 0;right: 0;bottom: 0;margin-top: 40px;"></iframe>
                </div>
            </div>
        </div>
    </div>
    <!--底部固定区域-->
    <!--    <div class="layui-footer">-->
    <!--        <p style="text-align: center;">-->
    <!--            <a href="https://blog.csdn.net/SuperCodeZhy" target="_blank">Copyright © 张宏业 https://blog.csdn.net/SuperCodeZhy</a>-->
    <!--        </p>-->
    <!--    </div>-->
</div>

<script th:src="@{/layui/layui.js}"></script>
<script>
    layui.use(['layer', 'tabs', 'jquery', 'util', 'dropdown', 'form'], function () {
        let layer = layui.layer;        // 弹出层
        let tabs = layui.tabs;          // 标签页
        let $ = layui.jquery;           // jQuery
        let util = layui.util;          // 工具模块
        let dropdown = layui.dropdown;  // 下拉菜单
        let form = layui.form;          // 表单组件
        let device = layui.device();    // 浏览器信息

        if (device.mobile) {
            layer.alert('移动设备显示效果不佳，建议使用电脑访问!');
        }

        // 页面顶部工具栏点击事件
        util.event('lay-header-event', {
            menuChange: function () {   // 边栏伸缩
                let btn = $('#leftEnumIcon');
                if (btn.hasClass('layui-icon-shrink-right')) {
                    btn.removeClass('layui-icon-shrink-right').addClass('layui-icon-spread-left');
                    $(".layui-side").animate({width: 'toggle'});
                    $(".layui-body").animate({left: '0px'});
                } else if (btn.has('layui-icon-spread-left')) {
                    btn.removeClass('layui-icon-spread-left').addClass('layui-icon-shrink-right');
                    $(".layui-side").animate({width: 'toggle'});
                    $(".layui-body").animate({left: '200px'});
                }
            },
            menuRefresh: function () {  // 刷新页面
                let activeTab = $('#demoTabs .layui-tabs-header li.layui-this');    // 获取当前激活的 tab 标签页
                if (activeTab.length) {
                    let tabId = activeTab.attr('lay-id');
                    // 获取对应的 iframe 元素
                    let iframe = $('#demoTabs .layui-tabs-body .layui-tabs-item[lay-id="' + tabId + '"] iframe');
                    if (iframe.length) {
                        iframe[0].contentWindow.location.reload();  // 刷新 iframe 页面
                    }
                }
            },
            menuNotice: function () {
                if (tabs.getHeaderItem('demoTabs', 'menu_notice').length) {
                    // 如果这个标签页存在，就切换到这个标签页
                    layui.tabs.change('demoTabs', 'menu_notice');
                } else {
                    // 如果这个标签页不存在，就添加新标签为这个标签页
                    tabs.add('demoTabs', {
                        title: '🔹我的消息通知',
                        content: '<iframe src="/toNoticePerson" style="border: none;position: absolute;width: 100%;height: 100%;left: 0;top: 0;right: 0;bottom: 0;margin-top: 40px;"></iframe>',
                        id: 'menu_notice',
                        done: function (data) {
                            // 给新标签头添加上下文菜单
                            dropdown.render($.extend({}, dropdownInst.config, {
                                elem: data.headerItem // 新标签头元素
                            }));
                        }
                    });
                }
            },
            menuAbout: function () {
                layer.open({
                    type: 2,
                    title: '更多信息',
                    offset: 'r',
                    anim: 'slideLeft', // 从右往左
                    area: ['30%', '100%'],
                    shade: 0.5,
                    shadeClose: true,
                    content: '/toSystemAbout'
                });
            },
            menuNote: function () {
                // 存储的键名
                const STORAGE_KEY = 'note';

                layer.open({
                    type: 1,
                    skin: 'layui-layer-win10',
                    shade: 0.5,
                    area: ['60%', '60%'],
                    title: '*无标题 - 记事本',
                    content: [
                        '<div style="padding: 0 8px; height: 20px; line-height: 20px; border-bottom: 1px solid #F0F0F0; box-sizing: border-box; font-size: 12px;">',
                        // 自定义菜单，此处仅作样式演示，具体功能尚未实现
                        [
                            '<a href="javascript:;">文件</a>&ensp;',
                            '<a href="javascript:;" >编辑</a>&ensp;',
                            '<a href="javascript:;" >格式</a>&ensp;',
                            '<a href="javascript:;" >查看</a>&ensp;',
                            '<a href="javascript:;" >帮助</a>',
                        ].join('   '),
                        '</div>',
                        '<textarea style="position: absolute; top: 20px; width: 100%; height: calc(100% - 20px); padding: 6px; border: none; resize: none; overflow-y: scroll; box-sizing: border-box;" id="myNote"></textarea>'
                    ].join(''),
                    success: function (layero, index) { // 弹窗加载完成后回调
                        // 从本地存储中读取之前保存的内容
                        const storageData = layui.data('DrugManageData');
                        const content = storageData[STORAGE_KEY] || '';

                        // 设置到文本域中
                        const textarea = layero.find('#myNote');
                        textarea.val(content);

                        // 自动聚焦到文本域
                        textarea.focus();
                    },
                    cancel: function (index, layero) {
                        // 获取文本域内容
                        const content = layero.find('#myNote').val();

                        // 保存到本地存储
                        layui.data('DrugManageData', {
                            key: STORAGE_KEY,
                            value: content
                        });
                        layer.msg('内容已保存');
                    }
                });
            },
            menuFull: function () { // 充满屏幕
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    document.getElementById("tool-screen-full").setAttribute("class", "layui-icon layui-icon-screen-restore");
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        document.getElementById("tool-screen-full").setAttribute("class", "layui-icon layui-icon-screen-full");
                    }
                }
            },
            aboutMe: function () {
                layer.msg('未实现');
            },
            setPass: function () {
                layer.open({
                    type: 1,
                    resize: false,
                    shadeClose: true,
                    area: '350px',
                    title: '-----修改密码-----',
                    content: ['<ul class="layui-form layui-form-pane" style="margin: 15px;">',
                        '<li class="layui-form-item">',
                        '<label class="layui-form-label">当前密码：</label>',
                        '<div class="layui-input-block">',
                        '<input type="password" name="oldPass" lay-verify="required" autocomplete="off" class="layui-input">',
                        '</div>',
                        '</li>',
                        '<li class="layui-form-item">',
                        '<label class="layui-form-label">最新密码：</label>',
                        '<div class="layui-input-block">',
                        '<input type="password" name="newPassOne" lay-verify="required" autocomplete="off" class="layui-input">',
                        '</div>',
                        '</li>',
                        '<li class="layui-form-item">',
                        '<label class="layui-form-label">确认密码：</label>',
                        '<div class="layui-input-block">',
                        '<input type="password" name="newPassTwo" lay-verify="required" autocomplete="off" class="layui-input">',
                        '</div>',
                        '</li>',
                        '<li class="layui-form-item" style="text-align:center;">',
                        '<button type="submit" lay-submit lay-filter="setPassword" class="layui-btn layui-btn-fluid">修 改 密 码</button>',
                        '</li>',
                        '</ul>'].join(''),
                    success: function (layero, index) {
                        layero.find('.layui-layer-content').css('overflow', 'visible');

                        form.render().on('submit(setPassword)', function (data) {
                            let field = data.field;
                            if (field.newPassOne !== field.newPassTwo) {
                                layer.msg('新密码两次输入不一致！', {icon: 2});
                                return false;
                            }

                            // 发起更新密码的请求
                            $.get('/doSetUserPassword', {'oldPass': field.oldPass, 'newPass': field.newPassOne}, function (response) {
                                console.log(response)
                                if (response === 1) {
                                    layer.msg('密码已更新');
                                    layer.close(index); //关闭层
                                } else if (response === 2) {
                                    layer.msg('原密码不正确，请重试！');
                                } else {
                                    layer.msg('修改失败，请联系管理员！');
                                }
                            });
                        });
                    }
                });
            },
            logout: function () { // 退出登录
                layer.confirm('确定退出登录嘛?', {
                    btn: ['确定', '取消']
                }, function () {
                    $.ajax({
                        url: '/doUserLogout',
                        type: 'GET',
                        success: function (res) {
                            if (res.code) {
                                layer.msg('登出成功', {icon: 1});
                                setTimeout(() => {
                                    window.location = '/toUserLogin';
                                }, 2000)
                            } else {
                                layer.msg('登出失败', {icon: 2});
                            }
                        },
                        error: function () {
                            layer.msg('Ajax请求异常', {icon: 0});
                        }
                    });
                }, function () {
                    layer.msg('已取消登出');
                });
            }
        });

        // 页面左侧菜单点击事件
        util.event('lay-aside-event', {
            menuAction: function (othis) {
                // 通过 lay-id 判断当前标签页是否存在，通过 DOM 元素的 dataset 属性获取元素的属性值
                if (tabs.getHeaderItem('demoTabs', 'menu' + othis[0].dataset.id).length) {
                    // 如果这个标签页存在，就切换到这个标签页
                    layui.tabs.change('demoTabs', 'menu' + othis[0].dataset.id);
                } else {
                    // 如果这个标签页不存在，就添加新标签为这个标签页
                    tabs.add('demoTabs', {
                        title: '🔹' + othis[0].dataset.name,
                        content: '<iframe src="' + othis[0].dataset.url + '" style="border: none;position: absolute;width: 100%;height: 100%;left: 0;top: 0;right: 0;bottom: 0;margin-top: 40px;"></iframe>',
                        id: 'menu' + othis[0].dataset.id,
                        done: function (data) {
                            // 给新标签头添加上下文菜单
                            dropdown.render($.extend({}, dropdownInst.config, {
                                elem: data.headerItem // 新标签头元素
                            }));
                        }
                    });
                }
            }
        });

        // 为标签头添加上下文菜单
        let dropdownInst = dropdown.render({
            elem: '#demoTabs .layui-tabs-header>li',
            trigger: 'contextmenu',
            data: [{
                title: '关闭当前标签页',
                action: 'close',
                mode: 'this',
            }, {
                type: '-'
            }, {
                title: '关闭其他标签页',
                action: 'close',
                mode: 'other'
            }, {
                title: '关闭右侧标签页',
                action: 'close',
                mode: 'right'
            }, {
                title: '关闭所有标签页',
                action: 'close',
                mode: 'all'
            }],
            click: function (data, othis, event) {
                let index = this.elem.index(); // 获取活动标签索引
                if (data.action === 'close') { // 关闭标签操作
                    if (data.mode === 'this') {
                        tabs.close('demoTabs', index); // 关闭当前标签
                    } else {
                        tabs.closeMult('demoTabs', data.mode, index); // 批量关闭标签
                    }
                }
            }
        });
    });
</script>
</body>
</html>
