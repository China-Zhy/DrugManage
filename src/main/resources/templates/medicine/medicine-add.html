<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>添加药品</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
<div class="layui-margin-3 layui-anim layui-anim-upbit" style="margin-top: 15px;">
    <div class="layui-row">
        <div class="layui-col-md12">
            <form class="layui-form layui-form-pane">
                <div class="layui-form-item layui-col-space32">

                    <!--左侧上传照片-->
                    <div class="layui-col-md5">
                        <div class="layui-col-md12">
                            <div class="layui-panel" style="aspect-ratio: 1/1;">
                                <img id="ID-upload-demo-img" style="width: 100%; height: 100%;">
                            </div>
                        </div>
                        <div class="layui-col-md12" style="margin-top: 10px;">
                            <div class="layui-progress layui-progress-big" lay-showPercent="yes" lay-filter="filter-demo">
                                <div class="layui-progress-bar" lay-percent=""></div>
                            </div>
                        </div>
                        <div class="layui-col-md12" style="margin-top: 10px;">
                            <button type="button" class="layui-btn layui-btn-normal layui-btn-sm layui-btn-fluid" id="ID-upload-demo-btn">
                                <i class="layui-icon layui-icon-upload"></i> 上传药品包装照片
                            </button>
                        </div>
                    </div>

                    <div class="layui-col-md7">
                        <label class="layui-form-label">药品名称</label>
                        <div class="layui-input-block">
                            <input type="text" name="name" autocomplete="off" class="layui-input" lay-verify="required">
                        </div>
                    </div>

                    <div class="layui-col-md7">
                        <label class="layui-form-label">国药准字</label>
                        <div class="layui-input-block">
                            <input type="text" name="code" autocomplete="off" class="layui-input" lay-verify="required">
                        </div>
                    </div>

                    <div class="layui-col-md7">
                        <label class="layui-form-label">药品规格</label>
                        <div class="layui-input-block">
                            <input type="text" name="specs" autocomplete="off" class="layui-input" lay-verify="required">
                        </div>
                    </div>

                    <div class="layui-col-md7">
                        <label class="layui-form-label">用法用量</label>
                        <div class="layui-input-block">
                            <input type="text" name="usage" autocomplete="off" class="layui-input" lay-verify="required">
                        </div>
                    </div>

                    <div class="layui-col-md7">
                        <label class="layui-form-label">生产厂家</label>
                        <div class="layui-input-block">
                            <input type="text" name="origin" autocomplete="off" class="layui-input" lay-verify="required">
                        </div>
                    </div>

                    <div class="layui-col-md7 layui-form-text">
                        <label class="layui-form-label">药品成分</label>
                        <div class="layui-input-block">
                            <textarea name="compose" class="layui-textarea" lay-verify="required" maxlength="1000" rows="10"></textarea>
                        </div>
                    </div>

                </div>

                <div class="layui-form-item layui-col-space20">
                    <div class="layui-col-md12" style="text-align: center;">
                        <button class="layui-btn" lay-submit lay-filter="toDo">添加</button>
                        <button type="reset" class="layui-btn layui-btn-primary">清空</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/layui/layui.js"></script>
<script>
    layui.use(['form', 'layer', 'jquery', 'upload', 'element'], function (form, layer, $, upload, element) {

        let imageIsOk = false;  // 图片上传结果

        // 单图片上传
        let uploadInst = upload.render({
            elem: '#ID-upload-demo-btn',
            url: '/uploadImage',
            size: 512, // 限制文件大小，单位KB
            before: function (obj) {
                // 预读本地文件示例，不支持ie8
                obj.preview(function (index, file, result) {
                    $('#ID-upload-demo-img').attr('src', result); // 图片链接（base64）
                });
                element.progress('filter-demo', '0%'); // 进度条复位
            },
            done: function (res) {
                if (res === 0) {
                    return layer.msg('上传失败');
                }
                layer.msg('上传成功');
                imageIsOk = true;
            },
            error: function () {
                layer.msg('上传出错，请联系管理员');
            },
            // 进度条
            progress: function (n, elem, e) {
                element.progress('filter-demo', n + '%'); // 可配合 layui 进度条元素使用
            }
        });

        // 表单提交事件
        form.on('submit(toDo)', function (data) {

            if (!imageIsOk) {
                layer.msg('请上传药品包装照片', {icon: 0});
                return false; // 阻止默认 form 跳转
            }

            let field = data.field; // 获取表单字段值

            $.ajax({
                url: '/doAddMedicine',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(field),
                success: function (res) {
                    if (res.code) {
                        layer.msg('添加成功', {icon: 1});
                        setTimeout(function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));    // 关闭弹出层
                        }, 2000);
                    } else {
                        layer.msg('添加失败', {icon: 2});
                        imageIsOk = false;
                    }
                },
                error: function (err) {
                    layer.msg('Ajax请求异常', {icon: 0});
                }
            });
            return false; // 阻止默认 form 跳转
        });
    });
</script>
</body>
</html>
