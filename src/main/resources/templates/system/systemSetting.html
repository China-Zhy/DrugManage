<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>系统设置</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
<div class="layui-margin-3 layui-anim layui-anim-upbit">
    <h1>颜色选择器：</h1>
    <div id="colorPicker"></div>
    <hr/>
    <h1>评分：</h1>
    <div id="ID-rate-demo-half"></div>
    <hr/>
    <pre class="layui-code code-demo" lay-options="{}">Hello World~</pre>
    <hr/>
    <pre class="layui-code code-demo" lay-options="{theme: 'dark'}">Hello World~</pre>
</div>

<script src="/layui/layui.js"></script>
<script>
    layui.use(['jquery', 'layer', 'colorpicker', 'rate'], function ($, layer, colorpicker, rate) {

        layer.msg('此页面目前仅展示部分Layui组件');

        // 渲染颜色选择器
        colorpicker.render({
            elem: '#colorPicker',
            size: 'xs',
            color: '#16baaa',
            predefine: true,
            alpha: true,
            done: function (color) {
                color || this.change(color);
            },
            change: function (color) {
                $('h1').css('color', color);
            },
            cancel: function (color) {
                this.change(color);
            }
        });

        // 渲染评分组件
        rate.render({
            elem: '#ID-rate-demo-half',
            value: 0,
            half: true,
            text: true,
            choose: function (value) {
                layer.msg('您的评分：' + value);
            }
        });

        // 渲染代码预览组件
        layui.code({
            elem: '.code-demo'
        });
    });
</script>
</body>
</html>
