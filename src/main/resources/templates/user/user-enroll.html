<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>药品管理系统 - 注册</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/layui/css/layui.css" rel="stylesheet">
    <style>
        .enroll-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .enroll-form {
            width: 320px;
        }
    </style>
</head>
<body>
<div class="enroll-container">
    <div class="enroll-form">
        <form class="layui-form">
            <h1 style="font-size: 50px; margin-bottom: 20px; text-align: center;">药品管理系统</h1>
            <div class="layui-form-item">
                <div class="layui-row">
                    <div class="layui-col-xs7">
                        <div class="layui-input-wrap">
                            <div class="layui-input-prefix">
                                <i class="layui-icon layui-icon-cellphone"></i>
                            </div>
                            <input type="text" name="phone" value="" lay-verify="required|phone" placeholder="手机号" lay-reqtext="请输入手机号" autocomplete="off" class="layui-input"
                                   id="reg-cellphone">
                        </div>
                    </div>
                    <div class="layui-col-xs5">
                        <div style="margin-left: 11px;">
                            <button type="button" class="layui-btn layui-btn-fluid layui-bg-gray" lay-on="getCode">获取验证码</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-vercode"></i>
                    </div>
                    <input type="text" name="vercode" value="" lay-verify="required" placeholder="验证码" lay-reqtext="请填写验证码" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-password"></i>
                    </div>
                    <input type="password" name="password" value="" lay-verify="required" placeholder="密   码" autocomplete="off" class="layui-input" id="reg-password" lay-affix="eye">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-wrap">
                    <div class="layui-input-prefix">
                        <i class="layui-icon layui-icon-password"></i>
                    </div>
                    <input type="password" name="confirmPassword" value="" lay-verify="required|confirmPassword" placeholder="确认密码" autocomplete="off" class="layui-input" lay-affix="eye">
                </div>
            </div>
            <div class="layui-form-item">
                <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="demo-reg">注 册</button>
            </div>
            <div class="layui-form-item">
                <a href="/toUserLogin" style="float: left; margin-top: 7px; margin-left: 5px;">登录帐号</a>
                <a href="#" style="float: right; margin-top: 7px; margin-right: 5px;">忘记密码</a>
            </div>
        </form>
    </div>
</div>

<script src="/layui/layui.js"></script>
<script>
    // 如果当前窗口是iframe，则强制在顶级窗口中打开目标URL
    if (window.top !== window.self) {
        window.top.location.href = window.self.location.href;
    }

    layui.use(['form', 'layer', 'util', 'jquery'], function (form, layer, util, $) {

        layer.msg('注册功能暂未开放');

        // 自定义验证规则
        form.verify({
            // 确认密码
            confirmPassword: function (value, item) {
                let passwordValue = $('#reg-password').val();
                if (value !== passwordValue) {
                    return '两次密码输入不一致';
                }
            }
        });

        // 普通事件
        util.on('lay-on', {
            // 获取验证码
            'getCode': function (othis) {
                let isValid = form.validate('#reg-cellphone'); // 主动触发验证，v2.7.0 新增
                if (isValid) {
                    layer.msg('无法获取验证码');
                    // 此处可继续书写「发送验证码」等后续逻辑
                }
            }
        });

        // 提交事件
        form.on('submit(demo-reg)', function (data) {
            let field = data.field; // 获取表单字段值

            // 显示填写结果，仅作演示用
            layer.alert(JSON.stringify(field), {
                title: '当前填写的字段值'
            });
            // 此处可执行 Ajax 等操作
            return false; // 阻止默认 form 跳转
        });
    });
</script>
</body>
</html>
